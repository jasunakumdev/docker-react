sudo: required
services:
  - docker

before_install:
  - docker build -t jasunakum/docker-react -f Dockerfile.dev .

script:
  - docker run -e CI=true jasunakum/docker-react npm run test -- --coverage

deploy:
  provider': elasticbeanstalk
  region: 'us-went-2'
  app: docker-app
  env: 'Docker-env'
  bucket_name: ''
  bucket_path: 'docker-react'
  on:
    branch: master
